# Serves the built React app and reverse-proxies /api/ to the Django container.
# Keeping both behind one origin (like the Vite dev proxy) means no CORS
# preflights and a first-party csrftoken cookie.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite writes hashed filenames into /assets/, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Voice clips are uploaded as multipart bodies (POST /api/chat/voice/);
    # nginx's default 1 MB body limit would reject them.
    client_max_body_size 10m;

    # "api" is the compose service name. No trailing slash, so the /api/ prefix
    # is kept and Django still sees /api/todos/...
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin and the static files (admin CSS/JS) it needs.
    # /admin/ is proxied, while /static/ is cached briefly - admin filenames
    # are not hashed, so a long cache would serve stale CSS after upgrades.
    location /admin/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://api:8000;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}